<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#173b3a" />
    <title>ARAL Buddy - DepEd Tutor Companion</title>
    <meta name="description" content="ARAL Tutor Buddy: track tutees, intervention sessions, progress, and Daily Time Record (DTR Form 48). Works offline." />
    
    <!-- Open Graph / Twitter -->
    <meta property="og:title" content="ARAL Buddy - DepEd Tutor Companion" />
    <meta property="og:description" content="ARAL Tutor Buddy: track tutees, intervention sessions, progress, and Daily Time Record (DTR Form 48). Works offline." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    
    <!-- PWA Setup -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ARAL Buddy" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <!-- Recommend changing this to a .png file for iOS compatibility -->
    <link rel="apple-touch-icon" href="/icon-180x180.png" />
    
    <script>
      (function() {
        // Suppress Vite HMR WebSocket errors in AI Studio iframe where HMR is disabled
        if (typeof window !== 'undefined') {
          // 1. Filter console.error for Vite WebSocket notices
          const originalConsoleError = console.error;
          console.error = function() {
            const firstArg = arguments[0];
            if (typeof firstArg === 'string' && (firstArg.includes('WebSocket closed without opened') || firstArg.includes('[vite] Error: WebSocket'))) {
              return;
            }
            return originalConsoleError.apply(console, arguments);
          };

          // 2. Intercept WebSocket if protocol is vite-hmr
          if (window.WebSocket) {
            const OrigWebSocket = window.WebSocket;
            window.WebSocket = function(url, protocols) {
              const isViteHMR = protocols === 'vite-hmr' || (typeof url === 'string' && (url.includes('@vite') || url.includes('vite-hmr')));
              if (isViteHMR) {
                return {
                  readyState: 1, // OPEN to avoid reconnection attempts
                  addEventListener: function() {},
                  removeEventListener: function() {},
                  send: function() {},
                  close: function() {},
                  onopen: null,
                  onclose: null,
                  onerror: null,
                  onmessage: null,
                };
              }
              return new OrigWebSocket(url, protocols);
            };
            window.WebSocket.prototype = OrigWebSocket.prototype;
            window.WebSocket.CONNECTING = OrigWebSocket.CONNECTING;
            window.WebSocket.OPEN = OrigWebSocket.OPEN;
            window.WebSocket.CLOSING = OrigWebSocket.CLOSING;
            window.WebSocket.CLOSED = OrigWebSocket.CLOSED;
          }

          // 3. Error event suppression
          window.addEventListener('error', function(e) {
            if (e && e.message && (e.message.includes('WebSocket') || e.message.includes('closed without opened'))) {
              e.stopImmediatePropagation();
              e.preventDefault();
            }
          }, true);
        }
      })();
    </script>
  </head>
  <body class="bg-[#f6f7f1] text-[#173b3a] min-h-screen antialiased selection:bg-[#e9b85e] selection:text-[#173b3a]">
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <script>
      // Absolute path used for SW to prevent routing 404s
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('Service Worker Registered Successfully!', reg))
            .catch(err => console.error('Registration Failed:', err));
        });
      }
    </script>
  </body>
</html>
